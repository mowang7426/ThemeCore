
name: Build ThemeCore 0.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install make dpkg ldid xz

      - name: Set THEOS
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "THEOS_MAKE_PATH=$HOME/theos/makefiles" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install RootHide Theos
        run: |
          rm -rf "$HOME/theos"
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install iPhoneOS 16.5 SDK
        run: |
          set -e
          rm -rf /tmp/theos-sdks
          mkdir -p "$HOME/theos/sdks"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          cd /tmp/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R "iPhoneOS16.5.sdk" "$HOME/theos/sdks/"

      - name: Verify Theos environment
        run: |
          set -e
          echo "THEOS=$THEOS"
          echo "THEOS_MAKE_PATH=$THEOS_MAKE_PATH"
          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/tweak.mk"
          test -f "$THEOS/makefiles/bundle.mk"

      - name: Verify package metadata
        run: |
          set -e
          grep -E '^(Package|Name|Version|Depends):' control
          grep -E '^(Package|Name|Version|Depends):' control.rootless

      - name: Prepare build directory
        run: |
          rm -rf build
          mkdir -p build
          # 备份 roothide 变体 control（含 Pre-Depends rootless-compat）
          cp control build/control.roothide

      - name: Use rootless control
        run: |
          set -e
          # rootless 变体不带 Pre-Depends: rootless-compat（Dopamine 源里没有该包）
          cp control.rootless control
          grep -E '^(Architecture|Pre-Depends):' control || true

      - name: Build Rootless
        run: |
          set -e
          make clean
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1

      - name: Copy Rootless package
        run: |
          set -e
          ROOTLESS_DEB=$(find packages -maxdepth 1 -type f -name "*.deb" | head -n 1)
          test -n "$ROOTLESS_DEB"
          cp "$ROOTLESS_DEB" "build/ThemeCore-0.3-rootless.deb"

      - name: Clean before RootHide
        run: |
          set -e
          make clean
          rm -rf packages
          # 还原 roothide 变体 control（iphoneos-arm64e + Pre-Depends rootless-compat）
          cp build/control.roothide control
          grep -E '^(Architecture|Pre-Depends):' control || true

      - name: Build RootHide
        run: |
          set -e
          THEOS_PACKAGE_SCHEME=roothide make package FINALPACKAGE=1

      - name: Copy RootHide package
        run: |
          set -e
          ROOTHIDE_DEB=$(find packages -maxdepth 1 -type f -name "*.deb" | head -n 1)
          test -n "$ROOTHIDE_DEB"
          cp "$ROOTHIDE_DEB" "build/ThemeCore-0.3-roothide.deb"

      - name: Verify packages
        run: |
          set +e
          fail=0
          for deb in build/*.deb; do
            echo "========== $deb =========="
            echo "--- control 字段 ---"
            dpkg-deb -f "$deb" Package Version Architecture Depends Pre-Depends
            echo "--- 关键产物路径（dylib / 设置 bundle / PreferenceLoader 入口）---"
            dpkg-deb -c "$deb" | grep -E 'DynamicLibraries/ThemeCore\.dylib|PreferenceBundles/ThemeCorePrefs\.bundle|PreferenceLoader/Preferences/ThemeCorePrefs'
            if ! dpkg-deb -c "$deb" | grep -q 'DynamicLibraries/ThemeCore\.dylib'; then
              echo "!! 缺少主 dylib：$deb"; fail=1
            fi
          done
          echo "--- Pre-Depends 差异核对 ---"
          RL=$(dpkg-deb -f build/ThemeCore-0.3-rootless.deb Pre-Depends)
          RH=$(dpkg-deb -f build/ThemeCore-0.3-roothide.deb Pre-Depends)
          echo "rootless Pre-Depends = [$RL]（预期为空）"
          echo "roothide Pre-Depends = [$RH]（预期含 rootless-compat）"
          if ! echo "$RH" | grep -q rootless-compat; then
            echo "!! roothide 包缺少 rootless-compat"; fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::warning::校验存在未通过项，详见上面输出（artifact 仍会上传）"
            exit 1
          fi
          echo "全部关键产物校验通过"

      - name: Upload DEB packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ThemeCore-0.3
          path: build/*.deb
